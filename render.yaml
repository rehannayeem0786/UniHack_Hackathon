# Render blueprint for the UniHack Product Intelligence API.
#
# Deploy from the Render dashboard -> New -> Blueprint -> select this repo, or
# submit this file as a Render.yaml. It declares the full set of environment
# variables that affect accuracy and speed - not just the README's short list -
# so a deploy can never silently lose the multi-model fallback chain or the
# tuning knobs.
#
# Secrets (GROQ_API_KEY, GEMINI_API_KEY) are left blank here on purpose: they
# must be entered once in the Render dashboard (Environment -> Secrets) and are
# never written to a file. Every non-secret value below matches .env.example.

services:
  - type: web
    name: unihack-product-intelligence
    runtime: python
    plan: free # <-- paid "always-on" plans avoid the free-tier cold-start
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Single instance: JobStore and the LLM gateway cache are in-memory by
    # design, so multiple workers would not share job or quota state.
    numWorkers: 1
    envVars:
      # --- Provider selection ---
      - key: LLM_PROVIDER
        value: groq
      # --- Groq ---
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_FAST
        value: llama-3.1-8b-instant
      # Set the multi-model fallback chain so a quota wall never degrades to
      # the deterministic path. Matches the local .env; weak models last.
      - key: GROQ_MODEL_CHAIN
        value: llama-3.3-70b-versatile,openai/gpt-oss-20b,llama-3.1-8b-instant,qwen/qwen3.6-27b,openai/gpt-oss-120b
      # --- Gemini (fallback provider) ---
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_CHAIN
        value: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-latest,gemma-4-31b-it
      # --- Pipeline tuning ---
      # Lower concurrency / more retries keeps a live run inside free-tier
      # per-minute limits instead of triggering the fallback chain.
      - key: MAX_CONCURRENCY
        value: "2"
      - key: BATCH_SIZE
        value: "4"
      - key: LLM_MAX_RETRIES
        value: "4"
      - key: ENABLE_LLM_CACHE
        value: "true"
      # data/cache is COMMITTED to the repo, so every deploy ships with the best
      # previously computed LLM + web answers pre-loaded (fast + accurate on the
      # free tier, no disk). Rebuild locally with scripts/seed_cache.py and push.
      - key: CACHE_DIR
        value: data/cache
      # --- Manufacturer source retrieval (web evidence) ---
      - key: WEB_ENABLED
        value: "true"
      - key: WEB_CACHE
        value: "true"
      - key: WEB_TIMEOUT
        value: "20"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: WEB_MAX_DOCUMENTS
        value: "3"
      - key: WEB_CONTEXT_CHARS
        value: "3500"
      # --- Server / CORS ---
      - key: LOG_LEVEL
        value: info
      # The frontend origin(s) the API will answer cross-origin. Include the
      # Vercel-hosted app or the browser will block every response (CORS).
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://uni-hack-hackathon.vercel.app
    # Secrets - set once in the Render dashboard, never committed here.
    # - key: GROQ_API_KEY
    #   sync: false
    # - key: GEMINI_API_KEY
    #   sync: false
    # A persistent disk is OPTIONAL and PAID-PLAN ONLY. The committed-cache
    # default needs no disk (CACHE_DIR=data/cache ships with the repo), so there
    # is deliberately NO disk block here: including one would make a Free-tier
    # blueprint deploy fail. If the cache should ever live off-git, attach a
    # disk manually in the Dashboard and mount it at data/cache.

# To also keep reviewer corrections between redeploys, mount a second disk at
# /opt/render/project/src/data (data/corrections.jsonl lives there). It is a
# small file; committing it to the repo is an equally valid option.
